# ============================================================================
# GitHub Actions: Continuous Integration Pipeline
# Scope: Restricted branch triggers, automated testing, and dynamic image delivery
# ============================================================================
name: CI Pipeline

on:
  push:
    branches:
      - 'develop'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Quality Assurance (Compilation, Unit & Testcontainers Testing)
  # -------------------------------------------------------------------------
  build-and-test:
    name: Build and Multi-Stage Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 Environment
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Project Modules
        run: mvn -B clean compile

      - name: Execute Isolated Unit Tests Suite
        run: mvn -B test

      - name: Execute Isolated Integration Tests Suite
        run: mvn -B verify -Dsurefire.skip=false -Dsurefire.includes=none -Dgroups=integration
